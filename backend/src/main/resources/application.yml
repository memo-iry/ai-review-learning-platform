spring:
  application:
    name: ai-review-learning-backend

  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:./backend/.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # Supabase Session pooler 의 최대 클라이언트가 15개다.
      # 조원 5명이 각자 로컬에서 띄우므로 인스턴스당 2개로 묶는다.
      # 넘기면 EMAXCONNSESSION 으로 기동 자체가 실패한다.
      maximum-pool-size: 2
      minimum-idle: 1
      idle-timeout: 30000
      max-lifetime: 600000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

logging:
  level:
    org.hibernate.orm.jdbc.bind: trace

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

app:
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
