spring:
  application:
    name: ai-review-learning-backend

  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:./backend/.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # Supabase Session pooler 의 최대 클라이언트가 15개다.
      # 조원 5명이 각자 로컬에서 띄우므로 인스턴스당 2개로 묶는다.
      # 넘기면 EMAXCONNSESSION 으로 기동 자체가 실패한다.
      maximum-pool-size: 2
      minimum-idle: 1
      idle-timeout: 30000
      max-lifetime: 600000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

logging:
  level:
    org.hibernate.orm.jdbc.bind: trace

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

app:
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}

  security:
    # 세션 기반 접근 통제 스위치.
    # 프론트에 로그인이 붙기 전까지는 false 로 두어 기존 흐름을 막지 않는다.
    # true 로 바꾸면 로그인하지 않은 요청은 401, 남의 데이터 요청은 403 이 된다.
    enforce: ${SECURITY_ENFORCE:false}

  ai:
    # openai 프로파일에서만 쓰인다. 기본 프로파일은 규칙 기반 어댑터를 쓰므로 키가 없어도 뜬다.
    # 키는 backend/.env 에 OPENAI_API_KEY 로 둔다. 저장소에 올라가지 않는다.
    api-key: ${OPENAI_API_KEY:}
    base-url: https://api.openai.com/v1
    model: gpt-4o-mini
    timeout-seconds: 60
    # 모델 호출이나 응답 파싱이 실패하면 규칙 기반 결과로 물러난다.
    # 분석이 실패했다고 화면이 비면 안 된다.
    fallback-to-rules: true
