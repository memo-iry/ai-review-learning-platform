spring:
  application:
    name: ai-review-learning-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ai_review}
    username: ${DB_USERNAME:ai_review}
    password: ${DB_PASSWORD:ai_review}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

app:
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
